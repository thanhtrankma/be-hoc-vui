name: be_vui_hoc
description: "Bé Vui Học - học mà chơi cho bé 3-6 tuổi"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Mọi dependency của cả app khai báo ở đây (agent Foundation). Agent sau KHÔNG sửa file này;
# cần thêm gói thì ghi vào báo cáo cuối. Firebase do agent I thêm sau.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # state + điều hướng + lưu trữ
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  collection: ^1.19.1
  # âm thanh (giọng đọc mp3, hiệu ứng tổng hợp, nhạc nền)
  flutter_soloud: ^5.2.1
  # game hành động (đua xe, bắn súng, xe tăng, RPG)
  flame: ^1.38.2
  # đồng bộ mã gia đình (PBKDF2 + AES-GCM) qua datpilot.com
  cryptography: ^2.9.0
  http: ^1.6.0
  # hình vector (dấu thanh, biểu tượng), mở link / chia sẻ, đọc to (micro), sao lưu file
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  speech_to_text: ^7.5.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_remote_config: ^6.7.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

# Mỗi thư mục con của sprites phải khai báo riêng (Flutter không tự quét thư mục con).
flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/audio/
    - assets/img/
    - assets/photo/
    - assets/sfx/
    - assets/sprites/
    - assets/sprites/animals/
    - assets/sprites/creatures/
    - assets/sprites/fish/
    - assets/sprites/fxa/
    - assets/sprites/gallery/
    - assets/sprites/kenney-board/
    - assets/sprites/kenney-fish/
    - assets/sprites/kenney-pirate/
    - assets/sprites/kenney-platformer/
    - assets/sprites/kenney-racing/
    - assets/sprites/kenney-tiny-dungeon/
    - assets/sprites/kenney-tiny-town/
    - assets/sprites/pets/
    - assets/sprites/plat/
    - assets/sprites/play/
    - assets/sprites/puzzle/
    - assets/sprites/racing/
    - assets/sprites/space/
    - assets/sprites/tanks/
    - assets/sprites/toon/
    - assets/icon/

  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/adaptive_bg.png"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#dff4ff"
  image: "assets/icon/splash.png"
  android_12:
    color: "#dff4ff"
    image: "assets/icon/splash_android12.png"

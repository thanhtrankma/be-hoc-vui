<body>
<div class="sky" aria-hidden="true"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
<main id="app"><section class="screen start">
  <div class="parade"><img src="img/man-superhero.webp" alt="" loading="lazy"><img src="img/robot.webp" alt="" loading="lazy"><img src="img/t-rex.webp" alt="" loading="lazy"><img src="img/princess.webp" alt="" loading="lazy"></div>
  <h1 class="logo">Bé <span>Vui</span> Học</h1>
  <p class="tagline">Vừa học vừa chơi</p>
  <button class="btn big" disabled>▶ Bắt đầu</button>
  <p class="startlinks"><a href="/be-vui-hoc" target="_blank" rel="noopener">Giới thiệu</a> · <a href="/be-vui-hoc/ghi-cong" target="_blank" rel="noopener">Ghi công</a></p>
</section></main>
<script>window.BVH_VERSION = '4c51d34a6e';
// Cứu hộ: app.js không chạy được (máy giữ bản cũ lẫn bản mới, mạng rớt, Safari lỗi) thì nút Bắt đầu bị khoá mãi.
// Tự dọn bản lưu offline + tải lại một lần; vẫn hỏng thì mở nút "Tải lại" và hiện lỗi để báo.
(function () {
  var timer;
  function repair() {
    try { sessionStorage.setItem('bvh.fix', String(Date.now())); } catch (e) {}
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('bvh-') === 0 && k.indexOf('bvh-' + window.BVH_VERSION) !== 0; }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(go, go);
    setTimeout(go, 3000);
    function go() { location.replace(location.pathname + '?r=' + Date.now()); }
  }
  window.BVH_FIX = repair;
  window.BVH_FAIL = function (msg) { fail(msg, true); };
  function fail(msg, force) {
    if ((window.BVH_OK && !force) || fail.done) return;
    fail.done = true;
    clearTimeout(timer);
    var last = 0;
    try { last = Number(sessionStorage.getItem('bvh.fix')) || 0; } catch (e) {}
    if (Date.now() - last > 120000) return repair();
    var btn = document.querySelector('.start .btn');
    if (!btn) return;
    var nb = btn.cloneNode(false);  // bỏ sự kiện cũ của app.js
    btn.parentNode.replaceChild(nb, btn);
    btn = nb;
    btn.disabled = false;
    btn.textContent = '↻ Tải lại';
    btn.onclick = repair;
    var p = document.createElement('p');
    p.className = 'tagline';
    p.style.fontSize = '14px';
    p.textContent = 'Chưa mở được app' + (msg ? ': ' + msg : '') + '. Bấm Tải lại hoặc kiểm tra mạng.';
    btn.parentNode.appendChild(p);
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName !== 'SCRIPT') return;  // hình lỗi không tính
    fail(e.message || (e.target && e.target.src ? 'không tải được ' + e.target.src.split('/').pop() : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message); });
  timer = setTimeout(function () { fail('tải quá lâu'); }, 20000);
})();
</script>
<script type="module" src="js/app.js?v=4c51d34a6e"></script>
</body>
